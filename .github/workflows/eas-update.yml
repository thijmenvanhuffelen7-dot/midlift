# Publishes every push as an EAS Update, so the newest version opens in Expo Go
# without downloading anything. Needs the repository secret EXPO_TOKEN.
name: EAS Update

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Fills in the project's owner (the Midlift organisation) from the project ID.
      - name: Link Expo project
        run: eas init --id d5203d36-e741-4698-8909-56cf477ee8b4 --force --non-interactive

      - name: Publish update
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual update' }}
        run: eas update --branch preview --message "$(echo "$MESSAGE" | head -n 1)" --non-interactive
